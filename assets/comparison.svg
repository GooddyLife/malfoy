tion:b5 29s linear infinite}@keyframes a6{0%,45.52%{opacity:0}46.90%,96%{opacity:1}100%{opacity:0}}@keyframes b6{0%,48.28%{opacity:0}49.66%,96%{opacity:1}100%{opacity:0}}@keyframes d6{0%,48.28%{fill:#e6edf3}50.00%,100%{fill:#7d8590}}.a6{animation:a6 29s linear infinite}.o6{animation:a6 29s linear infinite,d6 29s linear infinite}.b6{animation:b6 29s linear infinite}@keyframes a7{0%,52.41%{opacity:0}53.79%,96%{opacity:1}100%{opacity:0}}@keyframes b7{0%,55.17%{opacity:0}56.55%,96%{opacity:1}100%{opacity:0}}@keyframes d7{0%,55.17%{fill:#e6edf3}56.90%,100%{fill:#7d8590}}.a7{animation:a7 29s linear infinite}.o7{animation:a7 29s linear infinite,d7 29s linear infinite}.b7{animation:b7 29s linear infinite}@keyframes a8{0%,59.31%{opacity:0}60.69%,96%{opacity:1}100%{opacity:0}}@keyframes b8{0%,62.07%{opacity:0}63.45%,96%{opacity:1}100%{opacity:0}}@keyframes d8{0%,62.07%{fill:#e6edf3}63.79%,100%{fill:#7d8590}}.a8{animation:a8 29s linear infinite}.o8{animation:a8 29s linear infinite,d8 29s linear infinite}.b8{animation:b8 29s linear infinite}@keyframes a9{0%,66.21%{opacity:0}67.59%,96%{opacity:1}100%{opacity:0}}@keyframes b9{0%,68.97%{opacity:0}70.34%,96%{opacity:1}100%{opacity:0}}@keyframes d9{0%,68.97%{fill:#e6edf3}70.69%,100%{fill:#7d8590}}.a9{animation:a9 29s linear infinite}.o9{animation:a9 29s linear infinite,d9 29s linear infinite}.b9{animation:b9 29s linear infinite}@keyframes a10{0%,73.10%{opacity:0}74.48%,96%{opacity:1}100%{opacity:0}}@keyframes b10{0%,75.86%{opacity:0}77.24%,96%{opacity:1}100%{opacity:0}}@keyframes d10{0%,75.86%{fill:#e6edf3}77.59%,100%{fill:#7d8590}}.a10{animation:a10 29s linear infinite}.o10{animation:a10 29s linear infinite,d10 29s linear infinite}.b10{animation:b10 29s linear infinite}@keyframes a11{0%,80.00%{opacity:0}81.38%,96%{opacity:1}100%{opacity:0}}@keyframes b11{0%,82.76%{opacity:0}84.14%,96%{opacity:1}100%{opacity:0}}@keyframes d11{0%,82.76%{fill:#e6edf3}84.48%,100%{fill:#7d8590}}.a11{animation:a11 29s linear infinite}.o11{animation:a11 2