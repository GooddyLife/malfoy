<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 612" width="880" height="612" role="img" aria-label="Thirteen differences between the official Agentforce skills on their own and the same skills conducted by Malfoy. The full text is in the table below the image.">
<style>
