<rect width="880" height="612" rx="10" fill="#0d1117"/>
<text class="title" x="28" y="38">The official skills, with and without him</text>
<text class="head" x="196" y="74" fill="#8b949e">ON THEIR OWN</text>
<text class="head" x="556" y="74" fill="#3fb950">CONDUCTED BY MALFOY</text>
<line x1="0" y1="89" x2="880" y2="89" stroke="#30363d"/>
<rect x="1" y="90" width="878" height="34" fill="#11161d"/>
<text class="anim label a0" x="28" y="112">Where you start</text>
<text class="anim cell o0" x="196" y="112">Nine skills. You pick which, and when</text>
<path class="anim b0" d="M556 107 l4 4 l8 -9" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="anim cell win b0" x="580" y="112">One entry. Eight phases, in order</text>
<text class="anim label a1" x="28" y="146">Persona</text>
<text class="anim cell o1" x="196" y="146">A skill the build skill never mentions</text>
<path class="anim b1" d="M556 141 l4 4 l8 -9" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="anim cell win b1" x="580" y="146">Phase 3. Not skipped</text>
<rect x="1" y="158" width="878" height="34" fill="#11161d"/>
<text class="anim label a2" x="28" y="180">Phase is done</text>
<text class="anim cell o2" x="196" y="180">When the model judges it so</text>
<path class="anim b2" d="M556 175 l4 4 l8 -9" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="anim cell win b2" x="580" y="180">When a script exits 0</text>
<text class="anim label a3" x="28" y="214">The spec</text>
<text class="anim cell o3" x="196" y="214">Purpose, behaviour, subagents, actions</text>
<path class="anim b3" d="M556 209 l4 4 l8 -9" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="anim cell win b3" x="580" y="214">+ metric, scope, handoff, data, envs</text>
<rect x="1" y="226" width="878" height="34" fill="#11161d"/>
<text class="anim label a4" x="28" y="248">Tests vs. spec</text>
<text class="anim cell o4" x="196" y="248">&quot;Coverage maps against it&quot;, in prose</text>
<path class="anim b4" d="M556 243 l4 4 l8 -9" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="anim cell win b4" x="580" y="248"><tspan class="gate">coverage</tspan> names the untested use case</text>
<text class="anim label a5" x="28" y="282">Messy real records</text>
<text class="anim cell o5" x="196" y="282">Not in the template</text>
<path class="anim b5" d="M556 277 l4 4 l8 -9" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="anim cell win b5" x="580" y="282">spec S8 + coverage C6 on sandbox rows</text>
<rect x="1" y="294" width="878" height="34" fill="#11161d"/>
<text class="anim label a6" x="28" y="316">Live handoff</text>
<text class="anim cell o6" x="196" y="316">Instructions only</text>
<path class="anim b6" d="M556 311 l4 4 l8 -9" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="anim cell win b6" x="580" y="316"><tspan class="gate">handoff</tspan>: target, instructions, trace (H1–H11)</text>
<text class="anim label a7" x="28" y="350">The agent user</text>
<text class="anim cell o7" x="196" y="350">A setup guide, with queries to run</text>
<path class="anim b7" d="M556 345 l4 4 l8 -9" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="anim cell win b7" x="580" y="350"><tspan class="gate">perms</tspan> + optional object/field rows</text>
<rect x="1" y="362" width="878" height="34" fill="#11161d"/>
<text class="anim label a8" x="28" y="384">Compiler gaps</text>
<text class="anim cell o8" x="196" y="384">Reference pages to read</text>
<path class="anim b8" d="M556 379 l4 4 l8 -9" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="anim cell win b8" x="580" y="384"><tspan class="gate">lint</tspan>: seven rules, file and line</text>
<text class="anim label a9" x="28" y="418">&quot;It&#x27;s active&quot;</text>
<text class="anim cell o9" x="196" y="418">A query in the docs</text>
<path class="anim b9" d="M556 413 l4 4 l8 -9" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="anim cell win b9" x="580" y="418"><tspan class="gate">active</tspan>: pass or fail</text>
<rect x="1" y="430" width="878" height="34" fill="#11161d"/>
<text class="anim label a10" x="28" y="452">Edited after a pass</text>
<text class="anim cell o10" x="196" y="452">Nothing records it</text>
<path class="anim b10" d="M556 447 l4 4 l8 -9" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="anim cell win b10" x="580" y="452"><tspan class="gate">STALE</tspan></text>
<text class="anim label a11" x="28" y="486">Spec per version</text>
<text class="anim cell o11" x="196" y="486">Saved, not tied to what shipped</text>
<path class="anim b11" d="M556 481 l4 4 l8 -9" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="anim cell win b11" x="580" y="486"><tspan class="gate">active</tspan> logs version, hashes, commit</text>
<rect x="1" y="498" width="878" height="34" fill="#11161d"/>
<text class="anim label a12" x="28" y="520">Your repo&#x27;s rules</text>
<text class="anim cell o12" x="196" y="520">Not looked for</text>
<path class="anim b12" d="M556 515 l4 4 l8 -9" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="anim cell win b12" x="580" y="520">Read first. They override his</text>
<line x1="0" y1="550" x2="880" y2="550" stroke="#30363d"/>
<text class="anim closing z" x="440" y="584" text-anchor="middle">The official skills do the building. Malfoy makes them prove it.</text>
<rect x=".5" y=".5" width="879" height="611" rx="10" fill="none" stroke="#30363d"/>
</svg>
