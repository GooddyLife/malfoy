<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" role="img" aria-label="Ten differences between the official Agentforce skills on their own and the same skills conducted by Malfoy. The full text is in the table below the image.">
<style>
