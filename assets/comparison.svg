tion:b5 27s linear infinite}@keyframes a6{0%,48.89%{opacity:0}50.37%,96%{opacity:1}100%{opacity:0}}@keyframes b6{0%,51.85%{opacity:0}53.33%,96%{opacity:1}100%{opacity:0}}@keyframes d6{0%,51.85%{fill:#e6edf3}53.70%,100%{fill:#7d8590}}.a6{animation:a6 27s linear infinite}.o6{animation:a6 27s linear infinite,d6 27s linear infinite}.b6{animation:b6 27s linear infinite}@keyframes a7{0%,56.30%{opacity:0}57.78%,96%{opacity:1}100%{opacity:0}}@keyframes b7{0%,59.26%{opacity:0}60.74%,96%{opacity:1}100%{opacity:0}}@keyframes d7{0%,59.26%{fill:#e6edf3}61.11%,100%{fill:#7d8590}}.a7{animation:a7 27s linear infinite}.o7{animation:a7 27s linear infinite,d7 27s linear infinite}.b7{animation:b7 27s linear infinite}@keyframes a8{0%,63.70%{opacity:0}65.19%,96%{opacity:1}100%{opacity:0}}@keyframes b8{0%,66.67%{opacity:0}68.15%,96%{opacity:1}100%{opacity:0}}@keyframes d8{0%,66.67%{fill:#e6edf3}68.52%,100%{fill:#7d8590}}.a8{animation:a8 27s linear infinite}.o8{animation:a8 27s linear infinite,d8 27s linear infinite}.b8{animation:b8 27s linear infinite}@keyframes a9{0%,71.11%{opacity:0}72.59%,96%{opacity:1}100%{opacity:0}}@keyframes b9{0%,74.07%{opacity:0}75.56%,96%{opacity:1}100%{opacity:0}}@keyframes d9{0%,74.07%{fill:#e6edf3}75.93%,100%{fill:#7d8590}}.a9{animation:a9 27s linear infinite}.o9{animation:a9 27s linear infinite,d9 27s linear infinite}.b9{animation:b9 27s linear infinite}@keyframes z{0%,80.74%{opacity:0}82.22%,96%{opacity:1}100%{opacity:0}}.z{animation:z 27s linear infinite}
