name: test
on:
  push:
    branches: [main]  # branches are tested by their pull request; one run each, not two
  pull_request:
permissions:
  contents: read
jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
        include:  # 3.9 is the floor; ubuntu-latest no longer ships it
          - { os: macos-latest, python: "3.9" }
          - { os: windows-latest, python: "3.9" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Example passes its local gates
        working-directory: examples/order-status
        run: |
          python ../../skills/build-agent/scripts/gates.py spec spec.md
          python ../../skills/build-agent/scripts/gates.py lint OrderStatus.agent --final
          python ../../skills/build-agent/scripts/gates.py handoff spec.md OrderStatus.agent
          python ../../skills/build-agent/scripts/gates.py coverage spec.md tests.yaml

  all-gates:  # the one required check; skipped would count as passing, so it always runs
    if: always()
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.gates.result }}" = success
