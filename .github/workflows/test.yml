name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Example passes its local gates
        working-directory: examples/order-status
        run: |
          python ../../skills/build-agent/scripts/gates.py spec spec.md
          python ../../skills/build-agent/scripts/gates.py lint OrderStatus.agent --final
          python ../../skills/build-agent/scripts/gates.py coverage spec.md tests.yaml
